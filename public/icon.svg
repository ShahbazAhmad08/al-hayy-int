<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="navyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2144"/>
      <stop offset="50%" stop-color="#070E1E"/>
      <stop offset="100%" stop-color="#03070F"/>
    </linearGradient>
    <linearGradient id="goldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF3D5"/>
      <stop offset="25%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#AA7E18"/>
      <stop offset="75%" stop-color="#F7E7B6"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Midnight Navy Base Circle -->
  <circle cx="256" cy="256" r="248" fill="url(#navyBg)" stroke="#D4AF37" stroke-width="4"/>
  
  <!-- Outer Gold Laurel Border -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#goldFoil)" stroke-width="3" stroke-dasharray="8 5" />
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#goldFoil)" stroke-width="1.5" />
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#goldFoil)" stroke-width="2.5" />

  <!-- Arabic Calligraphy Monogram (Al Hayy) in Center -->
  <text x="256" y="285" font-family="'Cinzel Decorative', 'Amiri', 'Georgia', serif" font-size="130" font-weight="bold" fill="url(#goldFoil)" text-anchor="middle" filter="url(#goldGlow)">الحي</text>
  
  <!-- Subtitle Typography -->
  <text x="256" y="365" font-family="'Cinzel', 'Trajan Pro', serif" font-size="22" font-weight="bold" fill="url(#goldFoil)" letter-spacing="6" text-anchor="middle">AL HAYY</text>
  <text x="256" y="395" font-family="'Cinzel', sans-serif" font-size="13" font-weight="600" fill="#F7E7B6" letter-spacing="4" text-anchor="middle">SRINAGAR</text>
  
  <!-- Star Accent at top -->
  <polygon points="256,75 261,88 275,88 264,96 268,109 256,101 244,109 248,96 237,88 251,88" fill="url(#goldFoil)" />
</svg>
